#######################################
# Оверлей для прямого подключения Portainer к сокету без прокси.
# Использование: docker compose -f compose.yaml -f compose.direct.yaml up -d
#######################################

services:
  socket-proxy:
    # Переводим прокси в спящий профиль, чтобы он не запускался в прямом режиме
    profiles:
      - disabled

  portainer:
    command: !override
      - "-H"
      - "unix:///var/run/docker.sock"
    depends_on: !reset {}
    volumes: !override
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: !override
      - web_net